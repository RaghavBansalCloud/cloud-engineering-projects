name: Python CI Pipeline

# 1. TRIGGERS: Run this workflow on every push or pull request to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # JOB 1: Test the code and generate an artifact
  test:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run pytest and create the test report file
      - name: Run Unit Tests
        run: |
          pytest test_app.py -v

      # Step 5: Upload the generated text report as a build artifact
      - name: Upload Test Execution Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test_execution_report.txt

  # JOB 2: Dependent job that consumes the artifact
  build-check:
    needs: test # This makes Job B wait for Job A (test) to pass successfully!
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the artifact uploaded by Job 1
      - name: Download Test Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: test-report

      # Step 2: Verify the artifact exists and print a success statement
      - name: Verify and Print Report Content
        run: |
          echo "Successfully downloaded the artifact from the test job!"
          echo "--- REPORT CONTENTS BELOW ---"
          cat test_execution_report.txt
