name: Terraform CI Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  terraform-validate:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      # Step 3: Initialize a working directory containing Terraform configuration files
      - name: Terraform Init
        run: terraform init

      # Step 4: Validate the configuration files
      - name: Terraform Validate
        run: terraform validate

      # Step 5: Generate an execution plan to preview changes
      - name: Terraform Plan
        run: terraform plan
